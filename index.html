<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanze">
<meta name="theme-color" content="#0e1620">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Finanze</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --card2:#eef1f5; --text:#0e1620; --muted:#6b7686; --line:#e3e7ee;
  --green:#1f9d63; --red:#d6453d; --blue:#2f6fd6; --gold:#d39a00; --violet:#7b5cd6;
  --accent:#0f7a5a; --shadow:0 1px 2px rgba(14,22,32,.06),0 4px 16px rgba(14,22,32,.05);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1118; --card:#141c26; --card2:#1b2531; --text:#eef2f7; --muted:#8d98a8; --line:#243041;
    --green:#3cc685; --red:#ff6b62; --blue:#5b95ff; --gold:#f0b72f; --violet:#a28bff; --accent:#3cc685;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:28px;margin:0;letter-spacing:-.02em}
.sync{display:flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dot.wait{background:var(--gold)} .dot.off{background:var(--muted)} .dot.spin{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{padding:0 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .l{font-size:13px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--muted)} .sm{font-size:13px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.nav button{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);font-size:20px;box-shadow:var(--shadow)}
.nav .t{font-weight:700;font-size:17px;text-transform:capitalize}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.ic.in{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.ic.out{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid span.tag{display:inline-block;font-size:10px;padding:2px 7px;margin-right:4px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:14px 4px 6px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;background:var(--accent);color:#fff;font-size:16px}
.btn.sec{background:var(--card2);color:var(--text)} .btn.danger{background:transparent;color:var(--red)}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input.in:focus,select.in:focus{border-color:var(--accent)}
input.amount{font-size:34px;font-weight:800;text-align:center;border:0;background:transparent;padding:6px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.out{color:var(--red)} .seg button.on.in{color:var(--green)}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 8px;min-width:58px}
nav#tabs button.on{color:var(--accent)}
nav#tabs svg{width:24px;height:24px}
nav#tabs .plus{width:54px;height:54px;border-radius:18px;background:var(--accent);color:#fff;justify-content:center;margin-top:-22px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
nav#tabs .plus svg{width:28px;height:28px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
.overlay.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:0 0 6px;font-size:20px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;z-index:20;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.banner{background:color-mix(in srgb,var(--gold) 16%,var(--card));border-radius:var(--r);padding:14px;margin-bottom:12px;font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cat-row{margin-bottom:10px}.cat-row .row{font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
.inv-row{border-top:1px solid var(--line);padding:12px 0}
.inv-row:first-of-type{border-top:0}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.switch{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
</style>
</head>
<body>
<header><h1 id="titolo">Finanze</h1><button class="sync" id="syncBtn"><span class="dot" id="syncDot"></span><span id="syncTxt">—</span></button></header>
<main id="app"></main>

<nav id="tabs">
  <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Mese</button>
  <button data-v="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Investimenti</button>
  <button class="plus" id="plusBtn" aria-label="Nuovo movimento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-v="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Report</button>
  <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Impostazioni</button>
</nav>

<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= Utilità ================= */
const $ = s => document.querySelector(s);
const EUR = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
const PCT = new Intl.NumberFormat('it-IT', { style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MESI_B = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const TIPOLOGIE = ['ETF','Azioni','Obbligazioni','Titoli di Stato','Fondi','Crypto','Conto deposito','Fondo pensione','Polizza','Immobili','Oro e materie prime','Altro'];
const CATEGORIE_BASE = {
  Entrata: ['Stipendio','Bonus e premi','Rimborsi','Vendite','Interessi e dividendi','Altre entrate'],
  Uscita: ['Casa e affitto','Bollette e utenze','Spesa alimentare','Ristoranti e bar','Trasporti e auto','Salute','Abbigliamento','Svago e viaggi','Abbonamenti','Tasse e assicurazioni','Regali','Istruzione','Altre uscite']
};
const K = { cfg: 'fin.cfg', dati: 'fin.dati', coda: 'fin.coda', agg: 'fin.agg' };

const pad = n => String(n).padStart(2, '0');
const oggiISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const oggiMese = () => oggiISO().slice(0, 7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const eur = v => EUR.format(v || 0);
const pct = v => PCT.format(v || 0);
const segno = v => (v > 0 ? '+' : '') + eur(v);
const cls = v => v > 0.004 ? 'pos' : v < -0.004 ? 'neg' : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nomeMese = k => MESI[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
const etMese = k => MESI_B[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
const spostaMese = (k, d) => { let y = +k.slice(0, 4), m = +k.slice(5, 7) + d; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + pad(m); };
function numero(s) {
  if (s === null || s === undefined) return NaN;
  let t = String(s).replace(/[€\s]/g, '');
  if (t === '') return NaN;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  return parseFloat(t);
}
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ================= Stato ================= */
const S = {
  cfg: load(K.cfg, { url: '', token: '' }),
  dati: load(K.dati, { movimenti: [], categorie: [], strumenti: [], investimenti: [], ricorrenti: [] }),
  coda: load(K.coda, []),
  agg: load(K.agg, null),
  vista: 'home', mese: oggiMese(), anno: oggiMese().slice(0, 4), sync: false
};
if (!S.dati.ricorrenti) S.dati.ricorrenti = [];
const salvaLocale = () => { store(K.dati, S.dati); store(K.coda, S.coda); store(K.agg, S.agg); };

function categorie(tipo) {
  const c = S.dati.categorie.filter(x => x.tipo === tipo).map(x => x.categoria);
  return c.length ? c : CATEGORIE_BASE[tipo];
}

/* ========= Applicazione locale delle operazioni (uguale al foglio) ========= */
function applica(d, op) {
  d = JSON.parse(JSON.stringify(d));
  switch (op.action) {
    case 'salvaMovimento': {
      const m = { id: op.id, data: op.data, tipo: op.tipo, categoria: op.categoria, importo: Math.abs(op.importo), nota: op.nota || '' };
      const i = d.movimenti.findIndex(x => x.id === op.id);
      if (i >= 0) d.movimenti[i] = m; else d.movimenti.push(m);
      break;
    }
    case 'eliminaMovimento': d.movimenti = d.movimenti.filter(x => x.id !== op.id); break;
    case 'salvaInvestimenti':
      op.righe.forEach(r => {
        const i = d.investimenti.findIndex(x => x.mese === op.mese && x.strumentoId === r.strumentoId);
        const vuoto = (r.flusso === null || r.flusso === '') && (r.valore === null || r.valore === '');
        if (vuoto) { if (i >= 0) d.investimenti.splice(i, 1); return; }
        const s = d.strumenti.find(x => x.id === r.strumentoId);
        const rec = { id: r.id || uid(), mese: op.mese, strumentoId: r.strumentoId, strumento: s ? s.nome : '', flusso: r.flusso || 0, valore: r.valore === null || r.valore === '' ? null : r.valore, nota: r.nota || '' };
        if (i >= 0) d.investimenti[i] = rec; else d.investimenti.push(rec);
      });
      break;
    case 'salvaStrumento': {
      const s = { id: op.id, nome: op.nome, tipologia: op.tipologia, attivo: op.attivo !== false, nota: op.nota || '' };
      const i = d.strumenti.findIndex(x => x.id === op.id);
      if (i >= 0) d.strumenti[i] = s; else d.strumenti.push(s);
      break;
    }
    case 'aggiungiCategoria':
      if (!d.categorie.length) Object.keys(CATEGORIE_BASE).forEach(t => CATEGORIE_BASE[t].forEach(c => d.categorie.push({ tipo: t, categoria: c })));
      if (!d.categorie.some(c => c.tipo === op.tipo && c.categoria.toLowerCase() === op.categoria.toLowerCase())) d.categorie.push({ tipo: op.tipo, categoria: op.categoria });
      break;
    case 'eliminaCategoria':
      if (!d.categorie.length) Object.keys(CATEGORIE_BASE).forEach(t => CATEGORIE_BASE[t].forEach(c => d.categorie.push({ tipo: t, categoria: c })));
      d.categorie = d.categorie.filter(c => !(c.tipo === op.tipo && c.categoria === op.categoria));
      break;
    case 'salvaRicorrente': {
      d.ricorrenti = d.ricorrenti || [];
      const i = d.ricorrenti.findIndex(x => x.id === op.id);
      let ultimo = i >= 0 ? d.ricorrenti[i].ultimo : '';
      if (i < 0) { const cor = oggiMese(); ultimo = (!op.arretrati && op.inizio.slice(0, 7) < cor) ? spostaMese(cor, -1) : ''; }
      const r = { id: op.id, nome: op.nome, tipo: op.tipo, categoria: op.categoria, importo: Math.abs(op.importo), giorno: op.giorno,
        inizio: op.inizio, fine: op.fine || '', attiva: op.attiva !== false, ultimo };
      if (i >= 0) d.ricorrenti[i] = r; else d.ricorrenti.push(r);
      break;
    }
    case 'interrompiRicorrente':
      (d.ricorrenti || []).forEach(r => { if (r.id === op.id) { r.attiva = false; if (!r.fine || r.fine > op.data) r.fine = op.data; } });
      break;
    case 'riattivaRicorrente':
      (d.ricorrenti || []).forEach(r => { if (r.id === op.id) { r.attiva = true; r.fine = op.fine || ''; const p = spostaMese(oggiMese(), -1); if (!r.ultimo || r.ultimo < p) r.ultimo = p; } });
      break;
    case 'eliminaRicorrente':
      d.ricorrenti = (d.ricorrenti || []).filter(r => r.id !== op.id);
      break;
  }
  return generaLocale(d);
}

/* ========= Ricorrenze (stessa logica del foglio) ========= */
const giorniNelMese = k => new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate();
const dataRata = (k, giorno) => k + '-' + pad(Math.min(giorno, giorniNelMese(k)));
function scadenze(r, oggi) {
  const out = [];
  if (!r.attiva || !r.inizio) return out;
  let k = r.inizio.slice(0, 7);
  if (r.ultimo && spostaMese(r.ultimo, 1) > k) k = spostaMese(r.ultimo, 1);
  for (let g = 0; k <= oggi.slice(0, 7) && g < 600; g++, k = spostaMese(k, 1)) {
    const data = dataRata(k, r.giorno);
    if (data > oggi || (r.fine && data > r.fine)) break;
    if (data >= r.inizio) out.push({ mese: k, data });
  }
  return out;
}
function generaLocale(d) {
  const oggi = oggiISO();
  (d.ricorrenti || []).forEach(r => {
    scadenze(r, oggi).forEach(s => {
      const id = 'r' + r.id + '-' + s.mese;
      if (!d.movimenti.some(m => m.id === id)) d.movimenti.push({ id, data: s.data, tipo: r.tipo, categoria: r.categoria, importo: r.importo, nota: r.nome });
      r.ultimo = s.mese;
    });
  });
  return d;
}
function prossimaRata(r) {
  if (!r.attiva) return null;
  let k = r.inizio.slice(0, 7);
  if (r.ultimo && spostaMese(r.ultimo, 1) > k) k = spostaMese(r.ultimo, 1);
  for (let g = 0; g < 24; g++, k = spostaMese(k, 1)) {
    const data = dataRata(k, r.giorno);
    if (r.fine && data > r.fine) return null;
    if (data >= r.inizio) return data;
  }
  return null;
}
const isRata = (m, r) => m.id.startsWith('r' + r.id + '-');
const rateRegistrate = r => S.dati.movimenti.filter(m => isRata(m, r)).length;
function rateTotali(r) {
  if (!r.fine) return null;
  let n = 0, k = r.inizio.slice(0, 7);
  for (let g = 0; k <= r.fine.slice(0, 7) && g < 600; g++, k = spostaMese(k, 1)) { const dt = dataRata(k, r.giorno); if (dt >= r.inizio && dt <= r.fine) n++; }
  return n;
}
function statoRic(r) {
  if (r.attiva && (!r.fine || r.fine >= oggiISO())) return { t: 'Attiva', c: 'pos' };
  if (!r.attiva) return { t: 'Interrotta', c: 'mut' };
  return { t: 'Conclusa', c: 'mut' };
}
const dataIt = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';

/* ================= Calcoli (stessa logica del foglio) ================= */
function intervallo(da, a) { const out = []; let k = da; while (k <= a) { out.push(k); k = spostaMese(k, 1); } return out; }

function calcola(d) {
  const oggi = oggiMese();
  const set = new Set();
  d.movimenti.forEach(m => set.add(m.data.slice(0, 7)));
  d.investimenti.forEach(i => set.add(i.mese));
  const el = [...set].sort();
  const mesi = el.length ? intervallo(el[0], el[el.length - 1] > oggi ? el[el.length - 1] : oggi) : [];
  const ent = {}, usc = {};
  d.movimenti.forEach(m => { const k = m.data.slice(0, 7); if (m.tipo === 'Entrata') ent[k] = (ent[k] || 0) + m.importo; else usc[k] = (usc[k] || 0) + m.importo; });
  const perStr = {};
  d.investimenti.forEach(i => { (perStr[i.strumentoId] = perStr[i.strumentoId] || {})[i.mese] = i; });
  const stato = {};
  let valPrec = 0;
  const mensile = mesi.map(k => {
    let fl = 0;
    Object.keys(perStr).forEach(sid => {
      const r = perStr[sid][k]; if (!r) return;
      const s = stato[sid] || (stato[sid] = { valore: 0, investito: 0, versamenti: 0, ultimoMese: null });
      s.investito += r.flusso; fl += r.flusso; if (r.flusso > 0) s.versamenti += r.flusso;
      if (r.valore === null) s.valore += r.flusso; else { s.valore = r.valore; s.ultimoMese = k; }
    });
    let valore = 0, investito = 0;
    Object.values(stato).forEach(s => { valore += s.valore; investito += s.investito; });
    const variazione = valore - valPrec - fl, base = valPrec + fl;
    const rendimento = base > 0 ? variazione / base : 0;
    valPrec = valore;
    const e = ent[k] || 0, u = usc[k] || 0;
    return { mese: k, entrate: e, uscite: u, risparmio: e - u, investito, valore, guadagno: valore - investito, flusso: fl, variazione, rendimento };
  });
  const perAnno = {};
  mensile.forEach(m => {
    const a = m.mese.slice(0, 4);
    const x = perAnno[a] || (perAnno[a] = { anno: a, entrate: 0, uscite: 0, versato: 0, variazione: 0, fattore: 1, valoreFine: 0, guadagnoTotale: 0 });
    x.entrate += m.entrate; x.uscite += m.uscite; x.versato += m.flusso; x.variazione += m.variazione;
    x.fattore *= 1 + m.rendimento; x.valoreFine = m.valore; x.guadagnoTotale = m.guadagno;
  });
  const annuale = Object.keys(perAnno).sort().map(a => {
    const x = perAnno[a];
    return { anno: a, entrate: x.entrate, uscite: x.uscite, risparmio: x.entrate - x.uscite, tassoRisparmio: x.entrate > 0 ? (x.entrate - x.uscite) / x.entrate : 0,
      versato: x.versato, valoreFine: x.valoreFine, guadagnoAnno: x.variazione, twr: x.fattore - 1, guadagnoTotale: x.guadagnoTotale };
  });
  const info = {}; d.strumenti.forEach(s => info[s.id] = s);
  const ids = new Set([...d.strumenti.map(s => s.id), ...Object.keys(perStr)]);
  const portafoglio = [...ids].map(sid => {
    const s = stato[sid] || { valore: 0, investito: 0, versamenti: 0, ultimoMese: null };
    const i = info[sid] || {}; const g = s.valore - s.investito;
    const primo = perStr[sid] ? Object.values(perStr[sid])[0] : null;
    return { id: sid, nome: i.nome || (primo && primo.strumento) || sid, tipologia: i.tipologia || 'Altro', attivo: i.attivo !== false,
      investito: s.investito, valore: s.valore, guadagno: g, rendimento: s.versamenti > 0 ? g / s.versamenti : 0, ultimoMese: s.ultimoMese };
  }).sort((a, b) => b.valore - a.valore);
  return { mensile, annuale, portafoglio };
}

/* ================= Sincronizzazione con il foglio ================= */
async function richiesta(body) {
  let r;
  if (body) {
    r = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: S.cfg.token }, body)) });
  } else {
    r = await fetch(S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(S.cfg.token) + '&t=' + Date.now());
  }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Risposta non valida: controlla l\'indirizzo e che l\'app web sia pubblicata con accesso "Chiunque".'); }
  if (!j.ok) throw new Error(j.errore || 'Errore sconosciuto');
  return j;
}

async function sincronizza(silenzioso) {
  if (!S.cfg.url || !S.cfg.token) { if (!silenzioso) toast('Collega prima il tuo foglio in Impostazioni.'); return; }
  if (S.sync) return;
  S.sync = true; statoSync();
  try {
    const ops = S.coda.slice();
    const j = ops.length ? await richiesta({ action: 'batch', ops }) : await richiesta(null);
    S.coda = S.coda.slice(ops.length);
    S.dati = S.coda.reduce(applica, Object.assign({ ricorrenti: [] }, j.dati));
    S.agg = Date.now();
    salvaLocale();
    if (j.errori && j.errori.length) toast('Attenzione: ' + j.errori[0]);
    else if (!silenzioso) toast(ops.length ? 'Dati inviati al foglio ✓' : 'Dati aggiornati ✓');
  } catch (e) {
    if (!silenzioso || ('onLine' in navigator && navigator.onLine && S.coda.length)) {
      toast(navigator.onLine === false ? 'Sei offline: invierò i dati appena torna la connessione.' : 'Sincronizzazione non riuscita: ' + e.message);
    }
  } finally {
    S.sync = false; render();
    if (S.coda.length && navigator.onLine !== false) setTimeout(() => sincronizza(true), 4000);
  }
}

function esegui(op) {
  S.dati = applica(S.dati, op);
  S.coda.push(op);
  salvaLocale();
  render();
  sincronizza(true);
}

function statoSync() {
  const dot = $('#syncDot'), t = $('#syncTxt');
  dot.className = 'dot';
  if (!S.cfg.url) { dot.classList.add('off'); t.textContent = 'Non collegato'; return; }
  if (S.sync) { dot.classList.add('spin'); t.textContent = 'Sincronizzo…'; return; }
  if (S.coda.length) { dot.classList.add('wait'); t.textContent = S.coda.length + ' da inviare'; return; }
  if (navigator.onLine === false) { dot.classList.add('off'); t.textContent = 'Offline'; return; }
  t.textContent = S.agg ? 'Aggiornato ' + new Date(S.agg).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : 'Collegato';
}

/* ================= Grafici SVG ================= */
const fmtK = v => { const a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',') + 'M' : a >= 1000 ? (v / 1000).toFixed(a >= 1e4 ? 0 : 1).replace('.', ',') + 'k' : Math.round(v) + ''; };
function scala(min, max) {
  if (max === min) { max = min + 1; }
  const step = Math.pow(10, Math.floor(Math.log10((max - min) / 4)));
  const nice = [1, 2, 2.5, 5, 10].map(m => m * step).find(s => (max - min) / s <= 5) || step * 10;
  const lo = Math.floor(min / nice) * nice, hi = Math.ceil(max / nice) * nice;
  const ticks = []; for (let v = lo; v <= hi + nice / 2; v += nice) ticks.push(v);
  return { lo, hi, ticks };
}
function graficoBarre(etichette, serie, H = 170) {
  const W = 340, pl = 34, pr = 4, pt = 8, pb = 18;
  const tutti = serie.flatMap(s => s.valori);
  const sc = scala(Math.min(0, ...tutti), Math.max(1, ...tutti));
  const y = v => pt + (H - pt - pb) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  const n = etichette.length, gw = (W - pl - pr) / n, bw = Math.max(2, Math.min(12, (gw - 3) / serie.length));
  let g = '';
  sc.ticks.forEach(t => { g += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1 : .6}"/><text x="${pl - 4}" y="${y(t) + 3}" text-anchor="end">${fmtK(t)}</text>`; });
  etichette.forEach((e, i) => {
    const x0 = pl + i * gw + (gw - bw * serie.length) / 2;
    serie.forEach((s, j) => { const v = s.valori[i] || 0, y1 = y(Math.max(v, 0)), y2 = y(Math.min(v, 0)); g += `<rect x="${x0 + j * bw}" y="${y1}" width="${bw - 1}" height="${Math.max(0, y2 - y1)}" rx="2" fill="${s.colore}"/>`; });
    if (n <= 12 || i % Math.ceil(n / 12) === 0) g += `<text x="${pl + i * gw + gw / 2}" y="${H - 5}" text-anchor="middle">${esc(e)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>` + legenda(serie);
}
function graficoLinee(etichette, serie, H = 170) {
  const W = 340, pl = 34, pr = 6, pt = 8, pb = 18;
  const tutti = serie.flatMap(s => s.valori);
  if (!tutti.length) return '<div class="empty sm">Nessun dato</div>';
  const sc = scala(Math.min(0, ...tutti), Math.max(1, ...tutti));
  const y = v => pt + (H - pt - pb) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  const n = etichette.length, x = i => pl + (n === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (n - 1));
  let g = '';
  sc.ticks.forEach(t => { g += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1 : .6}"/><text x="${pl - 4}" y="${y(t) + 3}" text-anchor="end">${fmtK(t)}</text>`; });
  serie.forEach(s => {
    const pts = s.valori.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (s.area) g += `<polygon points="${x(0)},${y(Math.max(sc.lo, 0))} ${pts} ${x(n - 1)},${y(Math.max(sc.lo, 0))}" fill="${s.colore}" opacity=".12"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.colore}" stroke-width="${s.spessore || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.tratteggio ? 'stroke-dasharray="4 3"' : ''}/>`;
    if (n === 1) g += `<circle cx="${x(0)}" cy="${y(s.valori[0])}" r="3" fill="${s.colore}"/>`;
  });
  const passo = Math.max(1, Math.ceil(n / 6));
  etichette.forEach((e, i) => { if (i % passo === 0) { const ax = x(i) > W - 30 ? 'end' : x(i) < pl + 20 ? 'start' : 'middle'; g += `<text x="${x(i)}" y="${H - 5}" text-anchor="${ax}">${esc(e)}</text>`; } });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>` + legenda(serie);
}
const legenda = serie => serie.length > 1 ? `<div class="legend">${serie.map(s => `<span><i style="background:${s.colore}"></i>${esc(s.nome)}</span>`).join('')}</div>` : '';
const C = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();

    <div class="grid2" style="margin-top:12px"><div class="kpi"><div class="l">Entrate</div><div class="v pos">${eur(A.entrate)}</div></div><div class="kpi"><div class="l">Uscite</div><div class="v neg">${eur(A.uscite)}</div></div>
    <div class="kpi"><div class="l">Entrata media mensile</div><div class="v pos">${eur(mesiConDati ? A.entrate / mesiConDati : 0)}</div></div><div class="kpi"><div class="l">Spesa media mensile</div><div class="v neg">${eur(mesiConDati ? A.uscite / mesiConDati : 0)}</div></div>
    <div class="kpi"><div class="l">Tasso di risparmio</div><div class="v">${pct(A.tassoRisparmio)}</div></div><div class="kpi"><div class="l">Risparmio medio mensile</div><div class="v ${cls(A.risparmio)}">${eur(mesiConDati ? A.risparmio / mesiConDati : 0)}</div></div></div>
    <div class="hint">Medie calcolate sui ${mesiConDati} ${mesiConDati === 1 ? 'mese' : 'mesi'} del ${a} con movimenti.</div></div>`;
  h += `<div class="card"><h3>Entrate e uscite per mese</h3>${graficoBarre(MESI_B.map(m => m.charAt(0).toUpperCase()), [
    { nome: 'Entrate', valori: mesiA.map(k => perMese[k] ? perMese[k].entrate : 0), colore: C('green') },
    { nome: 'Uscite', valori: mesiA.map(k => perMese[k] ? perMese[k].uscite : 0), colore: C('red') }])}</div>`;
  h += `<div class="card"><h3>Risparmio per mese</h3>${graficoBarre(MESI_B.map(m => m.charAt(0).toUpperCase()), [
    { nome: 'Risparmio', valori: mesiA.map(k => perMese[k] ? perMese[k].risparmio : 0), colore: C('blue') }], 130)}</div>`;
  if (cu.length) h += `<div class="card"><h3>Uscite per categoria</h3>${cu.map(([c, v]) => `<div class="cat-row"><div class="row"><span>${esc(c)}</span><span><b>${eur(v)}</b> <span class="mut sm">${pct(A.uscite ? v / A.uscite : 0).replace(',00', '')}</span></span></div><div class="bar"><i style="width:${v / cu[0][1] * 100}%;background:var(--red);opacity:.75"></i></div></div>`).join('')}</div>`;
  if (ce.length) h += `<div class="card"><h3>Entrate per categoria</h3>${ce.map(([c, v]) => `<div class="cat-row"><div class="row"><span>${esc(c)}</span><b>${eur(v)}</b></div><div class="bar"><i style="width:${v / ce[0][1] * 100}%;background:var(--green);opacity:.8"></i></div></div>`).join('')}</div>`;
  h += `<div class="card"><h3>Investimenti nel ${a}</h3><div class="grid2">
    <div class="kpi"><div class="l">Versato nell'anno</div><div class="v">${eur(A.versato)}</div></div><div class="kpi"><div class="l">Valore a fine periodo</div><div class="v">${eur(A.valoreFine)}</div></div>
    <div class="kpi"><div class="l">Guadagno / perdita</div><div class="v ${cls(A.guadagnoAnno)}">${segno(A.guadagnoAnno)}</div></div><div class="kpi"><div class="l">Rendimento (TWR)</div><div class="v ${cls(A.twr)}">${pct(A.twr)}</div></div></div>
    <div style="margin-top:12px">${graficoBarre(MESI_B.map(m => m.charAt(0).toUpperCase()), [{ nome: 'G/P del mese', valori: mesiA.map(k => perMese[k] ? perMese[k].variazione : 0), colore: C('gold') }], 120)}</div><div class="hint">Guadagno o perdita di mercato mese per mese, esclusi i tuoi versamenti.</div></div>`;
  const storia = R.mensile.filter(m => m.valore || m.investito);
  if (storia.length > 1) h += `<div class="card"><h3>Capitale investito nel tempo</h3>${graficoLinee(storia.map(m => etMese(m.mese)), [
    { nome: 'Valore', valori: storia.map(m => m.valore), colore: C('green'), spessore: 2.5, area: true },
    { nome: 'Investito netto', valori: storia.map(m => m.investito), colore: C('muted'), tratteggio: true }])}</div>`;
  if (R.annuale.length) {
    const medie = R.annuale.slice().reverse().map(x => {
      const n = R.mensile.filter(m => m.mese.slice(0, 4) === x.anno && (m.entrate || m.uscite)).length;
      return `<tr><td><b>${x.anno}</b></td><td class="pos">${eur(n ? x.entrate / n : 0)}</td><td class="neg">${eur(n ? x.uscite / n : 0)}</td><td class="${cls(x.risparmio)}">${eur(n ? x.risparmio / n : 0)}</td></tr>`;
    }).join('');
    h += `<div class="card"><h3>Medie mensili per anno</h3><table class="t"><tr><th>Anno</th><th>Entrata</th><th>Spesa</th><th>Risparmio</th></tr>${medie}</table></div>`;
    h += `<div class="card"><h3>Confronto tra anni</h3><table class="t"><tr><th>Anno</th><th>Risparmio</th><th>G/P inv.</th><th>Rend.</th></tr>${R.annuale.slice().reverse().map(x => `<tr><td><b>${x.anno}</b></td><td class="${cls(x.risparmio)}">${eur(x.risparmio)}</td><td class="${cls(x.guadagnoAnno)}">${eur(x.guadagnoAnno)}</td><td class="${cls(x.twr)}">${pct(x.twr)}</td></tr>`).join('')}</table>
    ${R.annuale.length > 1 ? `<div style="margin-top:12px">${graficoBarre(R.annuale.map(x => x.anno), [{ nome: 'Risparmio', valori: R.annuale.map(x => x.risparmio), colore: C('blue') }, { nome: 'G/P investimenti', valori: R.annuale.map(x => x.guadagnoAnno), colore: C('gold') }], 150)}</div>` : ''}</div>`;
  }
  return h;
}

    <button class="btn sec" style="margin-top:10px" onclick="sincronizza(false)">Sincronizza ora</button></div>
    <div class="card"><h3>Movimenti ricorrenti</h3><p class="hint" style="margin:0 0 10px">${(S.dati.ricorrenti || []).filter(r => statoRic(r).t === 'Attiva').length} attive su ${(S.dati.ricorrenti || []).length}</p><button class="btn sec" onclick="listaRicorrenti()">Gestisci ricorrenti</button></div>
    <div class="card"><h3>Categorie di uscita</h3><div class="chip-row">${cat('Uscita')}</div>
      <div class="row" style="margin-top:10px"><input class="in" id="nuovaU" placeholder="Nuova categoria di uscita"><button class="btn" style="width:auto" onclick="nuovaCategoria('Uscita','nuovaU')">+</button></div></div>
    <div class="card"><h3>Categorie di entrata</h3><div class="chip-row">${cat('Entrata')}</div>

    <div class="card"><h3>Come si calcola</h3><p class="sm" style="margin:0">

/* ================= Moduli (fogli a comparsa) ================= */
function apri(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#ov').classList.add('open'); }
function chiudi() { $('#ov').classList.remove('open'); if (document.activeElement) document.activeElement.blur(); }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') chiudi(); });

let F = {};
function formMovimento(id) {
  const m = id ? S.dati.movimenti.find(x => x.id === id) : null;
  const meseOggi = S.mese === oggiMese();
  F = m ? Object.assign({}, m) : { id: null, tipo: 'Uscita', categoria: '', importo: '', data: meseOggi ? oggiISO() : S.mese + '-01', nota: '',
    ric: false, fineTipo: 'mai', nRate: '', fineData: '', arretrati: false };
  disegnaFormMovimento();
  if (!m) setTimeout(() => { const i = $('#fImp'); if (i) i.focus(); }, 280);
}
function leggiFormMov() {
  const v = id => { const el = $(id); return el ? el.value : undefined; };
  if (v('#fImp') !== undefined) F.importo = v('#fImp');
  if (v('#fNota') !== undefined) F.nota = v('#fNota');
  if (v('#fData') !== undefined) F.data = v('#fData');
  if (v('#fNRate') !== undefined) F.nRate = v('#fNRate');
  if (v('#fFineData') !== undefined) F.fineData = v('#fFineData');
  const a = $('#fArr'); if (a) F.arretrati = a.checked;
}
function bloccoRicorrenza() {
  if (F.id) return '';
  let h = `<div class="switch"><span><b>↻ Ripeti ogni mese</b><br><span class="hint" style="margin:0">Rata, affitto, abbonamento, stipendio…</span></span>
    <input type="checkbox" ${F.ric ? 'checked' : ''} onchange="leggiFormMov();F.ric=this.checked;disegnaFormMovimento()"></div>`;
  if (!F.ric) return h;
  const giorno = +(F.data || oggiISO()).slice(8, 10);
  h += `<div class="card" style="background:var(--card2);box-shadow:none;margin-top:10px">
    <div class="sm">Verrà registrata in automatico <b>ogni mese il giorno ${giorno}</b>${giorno > 28 ? ' (o l\'ultimo giorno del mese, se più corto)' : ''}, a partire dalla data indicata qui sotto.</div>
    <label class="f">Quando finisce?</label>
    <div class="seg">${[['mai', 'Mai'], ['rate', 'Dopo N rate'], ['data', 'In una data']].map(([k, l]) => `<button class="${F.fineTipo === k ? 'on' : ''}" onclick="leggiFormMov();F.fineTipo='${k}';disegnaFormMovimento()">${l}</button>`).join('')}</div>
    ${F.fineTipo === 'rate' ? `<label class="f">Numero di rate totali</label><input class="in" id="fNRate" inputmode="numeric" placeholder="Es. 36 (3 anni)" value="${esc(F.nRate)}">` : ''}
    ${F.fineTipo === 'data' ? `<label class="f">Ultima registrazione entro il</label><input class="in" type="date" id="fFineData" value="${esc(F.fineData)}">` : ''}
    <p class="hint">Potrai interromperla quando vuoi da "Ricorrenti": le registrazioni già fatte restano.</p>
    ${(F.data || '').slice(0, 7) < oggiMese() ? `<div class="switch"><span class="sm">Registra anche i mesi già passati<br><span class="hint" style="margin:0">Lascialo spento se quei mesi sono già nello storico (es. importati da BudJet)</span></span><input type="checkbox" id="fArr" ${F.arretrati ? 'checked' : ''}></div>` : ''}
  </div>`;
  return h;
}
function disegnaFormMovimento() {
  const cats = categorie(F.tipo);
  if (F.categoria && !cats.includes(F.categoria)) cats.push(F.categoria);
  apri(`<h2>${F.id ? 'Modifica movimento' : 'Nuovo movimento'}</h2>
    <div class="seg" style="margin-top:10px"><button class="${F.tipo === 'Uscita' ? 'on out' : ''}" onclick="leggiFormMov();F.tipo='Uscita';F.categoria='';disegnaFormMovimento()">Uscita</button><button class="${F.tipo === 'Entrata' ? 'on in' : ''}" onclick="leggiFormMov();F.tipo='Entrata';F.categoria='';disegnaFormMovimento()">Entrata</button></div>
    <input class="in amount ${F.tipo === 'Entrata' ? 'pos' : 'neg'}" id="fImp" inputmode="decimal" placeholder="0,00 €" value="${F.importo !== '' ? esc(String(F.importo).replace('.', ',')) : ''}">
    <label class="f">Categoria</label><div class="chip-row" id="fCat">${cats.map(c => `<button class="chip ${c === F.categoria ? 'on' : ''}" onclick="F.categoria=this.dataset.c;document.querySelectorAll('#fCat .chip').forEach(b=>b.classList.toggle('on',b===this))" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <label class="f">${F.ric ? 'Data della prima registrazione' : 'Data'}</label><input class="in" type="date" id="fData" value="${esc(F.data)}" onchange="if(F.ric){leggiFormMov();disegnaFormMovimento()}">
    <label class="f">${F.ric ? 'Nome (es. Rata BMW, Netflix)' : 'Nota (facoltativa)'}</label><input class="in" id="fNota" value="${esc(F.nota)}" placeholder="${F.ric ? 'Es. Rata auto' : 'Es. Esselunga, affitto ottobre…'}">
    ${bloccoRicorrenza()}
    <div class="btns" style="margin-top:18px"><button class="btn sec" onclick="chiudi()">Annulla</button><button class="btn" onclick="salvaMovimento()">Salva</button></div>
    ${F.id ? '<button class="btn danger" style="margin-top:8px" onclick="eliminaMovimento()">Elimina movimento</button>' : ''}`);
}
function salvaMovimento() {
  const imp = numero($('#fImp').value), data = $('#fData').value;
  if (!(imp > 0)) return toast('Inserisci un importo valido.');
  if (!F.categoria) return toast('Scegli una categoria.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) return toast('Inserisci una data valida.');
  if (F.ric && !F.id) return salvaNuovaRicorrenza(imp, data);
  esegui({ action: 'salvaMovimento', id: F.id || uid(), tipo: F.tipo, categoria: F.categoria, importo: Math.round(imp * 100) / 100, data, nota: $('#fNota').value.trim() });
  chiudi(); toast(F.id ? 'Movimento aggiornato' : 'Movimento salvato');
  S.mese = data.slice(0, 7); render();
}
function salvaNuovaRicorrenza(imp, data) {
  leggiFormMov();
  const nome = (F.nota || '').trim() || F.categoria;
  const giorno = +data.slice(8, 10);
  let fine = '';
  if (F.fineTipo === 'rate') {
    const n = parseInt(F.nRate, 10);
    if (!(n >= 1 && n <= 600)) return toast('Indica quante rate in totale (es. 36).');
    fine = dataRata(spostaMese(data.slice(0, 7), n - 1), giorno);
  } else if (F.fineTipo === 'data') {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(F.fineData) || F.fineData < data) return toast('La data di fine deve essere dopo la prima registrazione.');
    fine = F.fineData;
  }
  const arretrati = !!($('#fArr') && $('#fArr').checked);
  const op = { action: 'salvaRicorrente', id: uid(), nome, tipo: F.tipo, categoria: F.categoria, importo: Math.round(imp * 100) / 100, giorno, inizio: data, fine, attiva: true, arretrati };
  esegui(op);
  chiudi();
  const r = S.dati.ricorrenti.find(x => x.id === op.id), p = r && prossimaRata(r);
  toast('Ricorrenza creata' + (p ? ': prossima registrazione il ' + dataIt(p) : ''));
}

/* ---------- Gestione ricorrenze ---------- */
function listaRicorrenti() {
  const L = (S.dati.ricorrenti || []).slice().sort((a, b) => {
    const o = x => ({ Attiva: 0, Interrotta: 1, Conclusa: 2 })[statoRic(x).t];
    return o(a) - o(b) || a.nome.localeCompare(b.nome);
  });
  const righe = L.map(r => {
    const st = statoRic(r), n = rateRegistrate(r), tot = rateTotali(r), p = prossimaRata(r);
    return `<div class="item" onclick="formRicorrente('${esc(r.id)}')" style="${st.t === 'Attiva' ? '' : 'opacity:.6'}">
      <div class="ic ${r.tipo === 'Entrata' ? 'in' : 'out'}">↻</div>
      <div class="mid"><b>${esc(r.nome)}</b><span>${esc(r.categoria)} · giorno ${r.giorno} · <span class="${st.c}">${st.t}</span></span>
      <span>Registrate: ${n}${tot && r.attiva ? ' di ' + tot : ''}${p ? ' · prossima ' + dataIt(p) : ''}${!r.attiva && r.fine ? ' · ferma dal ' + dataIt(r.fine) : ''}</span></div>
      <div class="amt ${r.tipo === 'Entrata' ? 'pos' : ''}">${r.tipo === 'Entrata' ? '+' : '−'}${eur(r.importo)}</div></div>`;
  }).join('');
  apri(`<h2>Ricorrenti</h2><p class="hint" style="margin-bottom:12px">Movimenti che si registrano da soli ogni mese. Interrompendoli, quelli già registrati restano nello storico.</p>
    ${L.length ? `<div class="list">${righe}</div>` : '<div class="list"><div class="empty">Nessuna ricorrenza.<br>Creane una con <b>+</b> → "Ripeti ogni mese".</div></div>'}
    <div class="btns"><button class="btn sec" onclick="chiudi()">Chiudi</button><button class="btn" onclick="chiudi();setTimeout(()=>{formMovimento();F.ric=true;disegnaFormMovimento()},260)">+ Nuova ricorrenza</button></div>`);
}
function formRicorrente(id) {
  const r = S.dati.ricorrenti.find(x => x.id === id); if (!r) return;
  F = Object.assign({ fineMai: !r.fine }, r);
  const cats = categorie(r.tipo); if (r.categoria && !cats.includes(r.categoria)) cats.push(r.categoria);
  const st = statoRic(r), n = rateRegistrate(r), tot = rateTotali(r);
  apri(`<h2>${esc(r.nome)}</h2>
    <div class="sm"><span class="${st.c}"><b>${st.t}</b></span> · ${r.tipo} · dal ${dataIt(r.inizio)}${r.fine ? ' al ' + dataIt(r.fine) : ''} · registrate ${n}${tot && r.attiva ? ' di ' + tot : ''}</div>
    <label class="f">Nome</label><input class="in" id="rNome" value="${esc(r.nome)}">
    <label class="f">Importo mensile</label><input class="in" id="rImp" inputmode="decimal" value="${esc(String(r.importo).replace('.', ','))}">
    <label class="f">Categoria</label><div class="chip-row" id="rCat">${cats.map(c => `<button class="chip ${c === r.categoria ? 'on' : ''}" data-c="${esc(c)}" onclick="F.categoria=this.dataset.c;document.querySelectorAll('#rCat .chip').forEach(b=>b.classList.toggle('on',b===this))">${esc(c)}</button>`).join('')}</div>
    <div class="grid2"><div><label class="f">Giorno del mese</label><input class="in" id="rGiorno" inputmode="numeric" value="${r.giorno}"></div>
    <div><label class="f">Ultima registrazione entro</label><input class="in" type="date" id="rFine" value="${esc(r.fine)}"></div></div>
    <p class="hint">Lascia vuota la data per non avere una fine. Le modifiche valgono per le prossime registrazioni: quelle passate non cambiano.</p>
    <div class="btns" style="margin-top:16px"><button class="btn sec" onclick="chiudi()">Annulla</button><button class="btn" onclick="salvaRicorrenteModificata()">Salva</button></div>
    ${r.attiva && st.t === 'Attiva' ? `<button class="btn sec" style="margin-top:10px;color:var(--red)" onclick="interrompiRic('${esc(r.id)}')">⏹ Interrompi da oggi</button>`
      : `<button class="btn sec" style="margin-top:10px" onclick="riattivaRic('${esc(r.id)}')">▶︎ Riattiva</button>`}
    <button class="btn danger" style="margin-top:4px" onclick="eliminaRic('${esc(r.id)}')">Elimina la regola</button>`);
}
function salvaRicorrenteModificata() {
  const imp = numero($('#rImp').value), giorno = parseInt($('#rGiorno').value, 10), fine = $('#rFine').value, nome = $('#rNome').value.trim();
  if (!nome) return toast('Inserisci un nome.');
  if (!(imp > 0)) return toast('Inserisci un importo valido.');
  if (!(giorno >= 1 && giorno <= 31)) return toast('Il giorno va da 1 a 31.');
  if (fine && fine < F.inizio) return toast('La data di fine è prima dell\'inizio.');
  esegui({ action: 'salvaRicorrente', id: F.id, nome, tipo: F.tipo, categoria: F.categoria, importo: Math.round(imp * 100) / 100, giorno, inizio: F.inizio, fine, attiva: F.attiva });
  chiudi(); toast('Ricorrenza aggiornata');
}
function interrompiRic(id) {
  if (!confirm('Interrompere questa ricorrenza da oggi?\n\nLe registrazioni già fatte restano nello storico; non ne verranno create di nuove.')) return;
  esegui({ action: 'interrompiRicorrente', id, data: oggiISO() }); chiudi(); toast('Ricorrenza interrotta: lo storico è salvo');
}
function riattivaRic(id) {
  esegui({ action: 'riattivaRicorrente', id, fine: '' }); chiudi(); toast('Ricorrenza riattivata dal mese corrente');
}
function eliminaRic(id) {
  if (!confirm('Eliminare la regola?\n\nI movimenti già registrati restano; sparisce solo la ricorrenza dall\'elenco.')) return;
  esegui({ action: 'eliminaRicorrente', id }); chiudi(); toast('Regola eliminata');
}

function eliminaMovimento() {
  if (!confirm('Eliminare questo movimento?')) return;
  esegui({ action: 'eliminaMovimento', id: F.id }); chiudi(); toast('Movimento eliminato');
}

function formStrumento(id) {
  const s = id ? S.dati.strumenti.find(x => x.id === id) : null;
  F = s ? Object.assign({}, s) : { id: null, nome: '', tipologia: 'ETF', attivo: true, nota: '' };
  apri(`<h2>${s ? 'Modifica strumento' : 'Nuovo strumento'}</h2>
    <label class="f">Nome</label><input class="in" id="sNome" value="${esc(F.nome)}" placeholder="Es. ETF MSCI World, Conto deposito X">
    <label class="f">Tipologia</label><select class="in" id="sTipo">${TIPOLOGIE.map(t => `<option ${t === F.tipologia ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label class="f">Nota (facoltativa)</label><input class="in" id="sNota" value="${esc(F.nota)}" placeholder="Es. ISIN, banca, broker">
    ${s ? `<div class="switch"><span>Ancora in portafoglio</span><input type="checkbox" id="sAtt" ${F.attivo ? 'checked' : ''}></div><p class="hint">Se lo hai venduto tutto: registra in "Aggiorna valori" un prelievo pari a quanto hai incassato e valore 0, poi disattivalo qui.</p>` :
    `<label class="f">Capitale versato finora (facoltativo)</label><input class="in" id="sVers" inputmode="decimal" placeholder="0,00 €">
     <label class="f">Valore attuale (facoltativo)</label><input class="in" id="sVal" inputmode="decimal" placeholder="0,00 €">
     <p class="hint">Verranno registrati nel mese corrente come punto di partenza.</p>`}
    <div class="btns" style="margin-top:18px"><button class="btn sec" onclick="chiudi()">Annulla</button><button class="btn" onclick="salvaStrumento()">Salva</button></div>`);
}
function salvaStrumento() {
  const nome = $('#sNome').value.trim();
  if (!nome) return toast('Inserisci un nome.');
  const id = F.id || uid();
  esegui({ action: 'salvaStrumento', id, nome, tipologia: $('#sTipo').value, attivo: F.id ? $('#sAtt').checked : true, nota: $('#sNota').value.trim() });
  if (!F.id) {
    const v = numero($('#sVers').value), val = numero($('#sVal').value);
    if (!isNaN(v) || !isNaN(val)) esegui({ action: 'salvaInvestimenti', mese: oggiMese(), righe: [{ strumentoId: id, flusso: isNaN(v) ? 0 : v, valore: isNaN(val) ? (isNaN(v) ? null : v) : val }] });
  }
  chiudi(); toast('Strumento salvato');
}

function formValori(mese) {
  mese = mese || oggiMese();
  const attivi = S.dati.strumenti.filter(s => s.attivo !== false);
  if (!attivi.length) return formStrumento();
  const R = calcola({ ...S.dati, investimenti: S.dati.investimenti.filter(i => i.mese < mese) });
  const prec = {}; R.portafoglio.forEach(p => prec[p.id] = p.valore);
  const righe = attivi.map(s => {
    const r = S.dati.investimenti.find(i => i.mese === mese && i.strumentoId === s.id);
    return `<div class="inv-row" data-id="${esc(s.id)}"><div class="row"><b>${esc(s.nome)}</b><span class="tag">${esc(s.tipologia)}</span></div>
      <div class="grid2" style="margin-top:8px"><div><label class="f" style="margin-top:0">Versato (+) / ritirato (−)</label><input class="in fl" inputmode="text" placeholder="0" value="${r && r.flusso ? esc(String(r.flusso).replace('.', ',')) : ''}"></div>
      <div><label class="f" style="margin-top:0">Valore a fine mese</label><input class="in va" inputmode="decimal" placeholder="${prec[s.id] ? esc(eur(prec[s.id])) : '0,00 €'}" value="${r && r.valore !== null ? esc(String(r.valore).replace('.', ',')) : ''}"></div></div></div>`;
  }).join('');
  apri(`<h2>Aggiorna investimenti</h2>
    <label class="f">Mese</label><input class="in" type="month" id="vMese" value="${mese}" onchange="formValori(this.value)">
    <p class="hint">Per ogni strumento scrivi quanto hai aggiunto (o ritirato, con il segno −) in questo mese e quanto vale a fine mese. Il valore grigio è quello del mese precedente.</p>
    <div style="margin-top:6px">${righe}</div>
    <div class="btns" style="margin-top:18px"><button class="btn sec" onclick="chiudi()">Annulla</button><button class="btn" onclick="salvaValori()">Salva</button></div>`);
}
function salvaValori() {
  const mese = $('#vMese').value;
  if (!/^\d{4}-\d{2}$/.test(mese)) return toast('Mese non valido.');
  const righe = [];
  let errore = false;
  document.querySelectorAll('.inv-row').forEach(el => {
    const sid = el.dataset.id, fs = el.querySelector('.fl').value.trim(), vs = el.querySelector('.va').value.trim();
    const esiste = S.dati.investimenti.some(i => i.mese === mese && i.strumentoId === sid);
    const f = fs === '' ? null : numero(fs.replace('−', '-')), v = vs === '' ? null : numero(vs);
    if ((f !== null && isNaN(f)) || (v !== null && isNaN(v))) { errore = true; return; }
    if (f === null && v === null && !esiste) return;
    righe.push({ strumentoId: sid, flusso: f, valore: v });
  });
  if (errore) return toast('Controlla i numeri inseriti.');
  if (!righe.length) return toast('Nessun valore inserito.');
  righe.forEach(r => { if (r.flusso === null && r.valore !== null) r.flusso = 0; });
  esegui({ action: 'salvaInvestimenti', mese, righe });
  chiudi(); toast('Investimenti aggiornati');
}

/* ================= Azioni ================= */
function vai(v) { S.vista = v; render(); window.scrollTo(0, 0); }
function cambiaMese(d) { S.mese = spostaMese(S.mese, d); render(); }
function cambiaAnno(d) { S.anno = String(+S.anno + d); render(); }
async function salvaCfg() {
  S.cfg = { url: $('#cfgUrl').value.trim(), token: $('#cfgTok').value.trim().toUpperCase() };
  store(K.cfg, S.cfg);
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(S.cfg.url)) toast('L\'indirizzo dovrebbe iniziare con https://script.google.com/ e finire con /exec');
  await sincronizza(false);
}
function nuovaCategoria(tipo, inputId) {
  const v = $('#' + inputId).value.trim(); if (!v) return;
  esegui({ action: 'aggiungiCategoria', tipo, categoria: v });
}
function togliCategoria(tipo, c) {
  if (!confirm('Rimuovere la categoria "' + c + '"? I movimenti già registrati restano.')) return;
  esegui({ action: 'eliminaCategoria', tipo, categoria: c });
}
function reset() {
  if (S.coda.length && !confirm('Ci sono ' + S.coda.length + ' operazioni non ancora inviate al foglio: andranno perse. Continuare?')) return;
  if (!S.coda.length && !confirm('Cancellare i dati salvati sul telefono? Verranno riscaricati dal foglio.')) return;
  S.dati = { movimenti: [], categorie: [], strumenti: [], investimenti: [] }; S.coda = []; S.agg = null; salvaLocale(); render(); sincronizza(true);
}
let tT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => el.classList.remove('show'), 2800); }

document.querySelectorAll('#tabs [data-v]').forEach(b => b.addEventListener('click', () => vai(b.dataset.v)));
$('#plusBtn').addEventListener('click', () => formMovimento());
$('#syncBtn').addEventListener('click', () => sincronizza(false));
window.addEventListener('online', () => sincronizza(true));
window.addEventListener('offline', statoSync);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizza(true); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

render();
sincronizza(true);
</script>
</body>
</html>
